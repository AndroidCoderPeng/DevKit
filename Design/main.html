<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>DevKit 开发者工具集 · 主界面重设计稿</title>
    <link rel="stylesheet" href="main.css"/>
</head>
<body>
<div class="app">
    <div class="window">

        <!-- ============ 标题栏 ============ -->
        <header class="titlebar">
            <div class="brand">
                <span class="logo">
                    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                        <polyline points="4 17 10 11 4 5" fill="none" stroke="currentColor"
                                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <line x1="12" y1="19" x2="20" y2="19" stroke="currentColor" stroke-width="2"
                              stroke-linecap="round"/>
                    </svg>
                </span>
                <div class="brand-text">
                    <h1>DevKit</h1>
                    <p>开发者工具集</p>
                </div>
            </div>

            <!-- 置顶显示开关 -->
            <label class="topmost" title="置顶显示">
                <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
                    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M12 17v5M5.5 22h13M12 17l-3-4H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-3z"/>
                </svg>
                <span class="topmost-label">置顶显示</span>
                <input type="checkbox" class="switch-input" checked/>
                <span class="switch"></span>
            </label>
        </header>

        <!-- ============ 主体 ============ -->
        <main class="content">

            <!-- ---------- Android 工具 ---------- -->
            <section class="group">
                <div class="group-head">
                    <span class="group-title">Android工具</span>
                    <span class="count">3</span>
                    <span class="line"></span>
                </div>
                <div class="tools-grid cat-green">
                    <button class="tool">
                        <span class="tool-icon">
                            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                                <path fill="currentColor"
                                      d="M17.6 9.48l1.84-3.18a.4.4 0 0 0-.7-.4l-1.87 3.23a11.4 11.4 0 0 0-9.74 0L5.26 5.9a.4.4 0 0 0-.7.4L6.4 9.48A10.8 10.8 0 0 0 3 16.4V18a.9.9 0 0 0 .9.9h16.2a.9.9 0 0 0 .9-.9v-1.6c0-2.75-1.02-5.2-2.4-6.92zM7 15.25a1.1 1.1 0 1 1 0-2.2 1.1 1.1 0 0 1 0 2.2zm10 0a1.1 1.1 0 1 1 0-2.2 1.1 1.1 0 0 1 0 2.2z"/>
                            </svg>
                        </span>
                        <span class="tool-name">ADB</span>
                    </button>
                    <button class="tool">
                        <span class="tool-icon">
                            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                                <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                      stroke-linejoin="round"
                                      d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                                <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                      stroke-linejoin="round" d="M3.27 6.96L12 12.01l8.73-5.05"/>
                                <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                      stroke-linejoin="round" d="M12 22.08V12"/>
                            </svg>
                        </span>
                        <span class="tool-name">APK</span>
                    </button>
                    <button class="tool">
                        <span class="tool-icon">
                            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                                <polyline points="16 18 22 12 16 6" fill="none" stroke="currentColor"
                                          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <polyline points="8 6 2 12 8 18" fill="none" stroke="currentColor"
                                          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </span>
                        <span class="tool-name">JNI逆向</span>
                    </button>
                </div>
            </section>

            <!-- ---------- Socket 通信工具 ---------- -->
            <section class="group">
                <div class="group-head">
                    <span class="group-title">Socket通信工具</span>
                    <span class="count">6</span>
                    <span class="line"></span>
                </div>
                <div class="tools-grid cat-blue">
                    <button class="tool">
                        <span class="tool-icon">
                            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                                <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                      stroke-linejoin="round" d="M22 2L11 13"/>
                                <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                      stroke-linejoin="round" d="M22 2l-7 20-4-9-9-4 22-7z"/>
                            </svg>
                        </span>
                        <span class="tool-name">TCP客户端</span>
                    </button>
                    <button class="tool">
                        <span class="tool-icon">
                            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                                <rect x="2" y="2" width="20" height="8" rx="2" fill="none" stroke="currentColor"
                                      stroke-width="2"/>
                                <rect x="2" y="14" width="20" height="8" rx="2" fill="none" stroke="currentColor"
                                      stroke-width="2"/>
                                <line x1="6" y1="6" x2="6.01" y2="6" stroke="currentColor" stroke-width="2"
                                      stroke-linecap="round"/>
                                <line x1="6" y1="18" x2="6.01" y2="18" stroke="currentColor" stroke-width="2"
                                      stroke-linecap="round"/>
                            </svg>
                        </span>
                        <span class="tool-name">TCP服务端</span>
                    </button>
                    <button class="tool">
                        <span class="tool-icon">
                            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                                <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                      stroke-linejoin="round" d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                            </svg>
                        </span>
                        <span class="tool-name">UDP客户端</span>
                    </button>
                    <button class="tool">
                        <span class="tool-icon">
                            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                                <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                      stroke-linejoin="round" d="M5 12.55a11 11 0 0 1 14.08 0"/>
                                <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                      stroke-linejoin="round" d="M1.42 9a16 16 0 0 1 21.16 0"/>
                                <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                      stroke-linejoin="round" d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
                                <line x1="12" y1="20" x2="12.01" y2="20" stroke="currentColor" stroke-width="2"
                                      stroke-linecap="round"/>
                            </svg>
                        </span>
                        <span class="tool-name">UDP服务端</span>
                    </button>
                    <button class="tool">
                        <span class="tool-icon">
                            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                                <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                      stroke-linejoin="round"
                                      d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
                            </svg>
                        </span>
                        <span class="tool-name">WS客户端</span>
                    </button>
                    <button class="tool">
                        <span class="tool-icon">
                            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                                <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
                                <line x1="2" y1="12" x2="22" y2="12" stroke="currentColor" stroke-width="2"/>
                                <path fill="none" stroke="currentColor" stroke-width="2"
                                      d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                            </svg>
                        </span>
                        <span class="tool-name">WS服务端</span>
                    </button>
                </div>
            </section>

            <!-- ---------- 其他工具 ---------- -->
            <section class="group">
                <div class="group-head">
                    <span class="group-title">其他工具</span>
                    <span class="count">2</span>
                    <span class="line"></span>
                </div>
                <div class="tools-grid cat-purple">
                    <button class="tool">
                        <span class="tool-icon">
                            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                                <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                      stroke-linejoin="round"
                                      d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
                            </svg>
                        </span>
                        <span class="tool-name">颜色值转换</span>
                    </button>
                    <button class="tool">
                        <span class="tool-icon">
                            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                                <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
                                <line x1="12" y1="16" x2="12" y2="12" stroke="currentColor" stroke-width="2"
                                      stroke-linecap="round"/>
                                <line x1="12" y1="8" x2="12.01" y2="8" stroke="currentColor" stroke-width="2"
                                      stroke-linecap="round"/>
                            </svg>
                        </span>
                        <span class="tool-name">网络信息</span>
                    </button>
                </div>
            </section>

        </main>

        <!-- ============ 状态栏 ============ -->
        <footer class="statusbar">
            <span>DevKit · 已就绪</span>
            <span class="statusbar-right">点击工具卡片即可打开</span>
        </footer>

    </div>
</div>
</body>
</html>
