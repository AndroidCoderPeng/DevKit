<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>扩展指令 · 界面重设计稿</title>
    <link rel="stylesheet" href="excommand.css?v=2" />
</head>

<body>

    <!-- ============ 演示用：状态切换器（仅设计稿） ============ -->
    <div class="demo-switch">
        <span class="demo-title">演示状态</span>
        <button class="demo-btn active" data-status="add">新增</button>
        <button class="demo-btn" data-status="edit">编辑</button>
        <button class="demo-btn" data-status="invalid">校验错误</button>
    </div>

    <div class="app">
        <!--
      注意：本窗口为 Prism 对话框，窗口标题由系统默认标题栏提供（添加扩展指令 / 编辑扩展指令），
      因此窗口内容顶部不再放置标题栏，直接是表单主体。

      与原 XAML 的对应关系：
      - 指令值：保留（原为多行 TextBox，这里同为多行输入），标记为必填；
        新增 HEX/ASCII 编码切换（决定校验规则与保存格式）；HEX 模式下提供
        「格式化」按钮（补零 + 大写 + 规范空格分隔）；两种模式均有实时字节数与字节可视化条。
      - 备注：保留，作为可选字段。
    -->
        <div class="window">

            <!-- 演示用：仿真实窗口 chrome，仅示意标题随模式变化，非窗口内容 -->
            <div class="demo-titlebar" id="demoTitlebar">
                <span class="title">添加扩展指令</span>
                <span class="win-controls" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="12" height="12">
                        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M5 12h14" />
                    </svg>
                    <svg viewBox="0 0 24 24" width="12" height="12">
                        <rect x="5.5" y="5.5" width="13" height="13" rx="1.5" fill="none" stroke="currentColor"
                            stroke-width="2" />
                    </svg>
                    <svg viewBox="0 0 24 24" width="12" height="12">
                        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            d="M6 6l12 12M18 6L6 18" />
                    </svg>
                </span>
            </div>

            <!-- ============ 表单主体 ============ -->
            <div class="form">

                <!-- 指令值 -->
                <div class="form-row">
                    <span class="form-label">
                        <span class="label-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" width="13" height="13">
                                <rect x="7" y="7" width="10" height="10" rx="2" fill="none" stroke="currentColor"
                                    stroke-width="2" />
                                <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    d="M10 2.5V5M14 2.5V5M10 19v2.5M14 19v2.5M2.5 10H5M2.5 14H5M19 10h2.5M19 14h2.5" />
                            </svg>
                        </span>
                        指令值 <span class="req">*</span>

                        <!-- 发送编码：决定校验规则、格式化按钮与字节条的解析方式 -->
                        <span class="segmented" id="encSeg">
                            <button class="active" data-enc="hex">HEX</button>
                            <button data-enc="ascii">ASCII</button>
                        </span>

                        <span class="tip" id="cmdTip">HEX 字节，空格分隔</span>
                        <span class="byte-chip" id="byteChip">5 B</span>
                        <button class="icon-btn" id="btnFormat" title="格式化：转大写、补零并规范空格分隔">
                            <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true">
                                <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" d="M4 7h13M4 12h9M4 17h13" />
                                <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" d="M19 9l2 2-2 2" />
                            </svg>
                        </button>
                    </span>

                    <label class="input-wrap area" id="cmdWrap">
                        <textarea id="cmdValue" rows="3" placeholder="例如：AA 55 01 01" title="指令值"
                            spellcheck="false">AA 55 03 01 FF</textarea>
                    </label>

                    <!-- 字节可视化：固定单行横向滚动，非法字节标红 -->
                    <div class="byte-strip" id="byteStrip"></div>
                </div>

                <!-- 备注 -->
                <div class="form-row">
                    <span class="form-label">
                        <span class="label-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" width="13" height="13">
                                <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M20.6 13.4 12 22 2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z" />
                                <circle cx="7.5" cy="7.5" r="1.4" fill="currentColor" stroke="none" />
                            </svg>
                        </span>
                        备注
                        <span class="tip">可选，便于在指令列表中识别</span>
                    </span>

                    <label class="input-wrap plain" id="annoWrap">
                        <input id="annoValue" type="text" value="开启采集" placeholder="例如：握手请求" title="备注"
                            maxlength="50" spellcheck="false" />
                    </label>
                </div>

            </div>

            <!-- 输入校验提示（有错误时才出现，不占用固定高度） -->
            <div class="toolbar-hint" id="hint" style="margin-top:14px">
                <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true">
                    <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" />
                    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 8v5" />
                    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 16.5h.01" />
                </svg>
                <span id="hintText">指令值格式不正确：仅支持十六进制字节（00 - FF），以空格分隔</span>
            </div>

            <!-- ============ 底部：操作按钮（等宽平分，避免左倾） ============ -->
            <footer class="footer">
                <button class="btn" id="btnCancel">
                    <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true">
                        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" d="M6 6l12 12M18 6L6 18" />
                    </svg>
                    取消
                </button>

                <button class="btn btn-primary" id="btnSave">
                    <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true">
                        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" d="M5 13l4 4L19 7" />
                    </svg>
                    保存
                </button>
            </footer>

        </div>
    </div>

    <script src="excommand.js?v=2"></script>
</body>

</html>
